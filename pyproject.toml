[project]
name = "pyspc"
version = "0.6.4"
description = "Tools for Spectroscopy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Rustam Guliev", email = "glvrst@gmail.com" },
]
keywords = ["spectroscopy", "Raman", "IR", "signal", "processing"]
dependencies = [
    "pandas>=2.1.1,<3.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.2",
    "pybaselines>=1.1.0",
]

[project.optional-dependencies]
einops = ["einops>=0.6.0"]
all = ["einops>=0.6.0"]

[dependency-groups]
dev = [
    "black>=23.9.1,<24.0.0",
    "ruff>=0.0.291",
    "pytest>=7.4.2,<8.0.0",
    "pre-commit>=3.4.0,<4.0.0",
    "ipython>=8.15.0,<9.0.0",
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.28,<10.0.0",
    "mkdocstrings[python]>=0.25.1,<0.26.0",
    "pymdown-extensions>=10.9,<11.0",
    "mkdocs-exclude>=1.0.2,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[tool.pytest.ini_options]
norecursedirs = ["site"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
ignore = ["E731"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".vscode",
]
per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
