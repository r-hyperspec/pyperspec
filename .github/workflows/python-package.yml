name: Python package

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7.1.1
      with:
        version: "0.11.26"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Lint
      run: uv run --locked pre-commit run --all-files

    - name: Run tests
      run: uv run --locked pytest --doctest-modules --cov --cov-branch --cov-report=xml

    - name: Upload results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build documentation
      run: uv run --locked mkdocs build --strict

